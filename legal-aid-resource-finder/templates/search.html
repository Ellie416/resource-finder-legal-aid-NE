<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Aid Nebraska</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top-bar">
    <div class="logo" aria-label="Legal Aid Nebraska">
        <img src="{{ url_for('static', filename='legal-aid-logo-3.png') }}" alt="Legal Aid Nebraska logo">
    </div>
</header>

<main class="search-page">
    <section class="search-container">
        <h1>My client needs...</h1>

        <div class="need-input-wrapper">
            <input id="clientNeed" type="text" placeholder="Housing help" autocomplete="off">
        </div>
        <label id="searchAllWrapper" class="search-all-checkbox hidden">
            <input type="checkbox" id="searchAllResources">
            <span>Search all resources for selected location</span>
        </label>

        <div class="location-controls">
            <div class="filter-row">
                <button id="locationToggle" class="toggle" type="button" aria-pressed="false">
                    <span class="toggle-knob"></span>
                </button>
                <span>Filter Location</span>
            </div>

            <!-- NEW CONTAINER: Groups radios and dropdown side-by-side -->
            <div class="location-selection-area">
                <div id="locationOptions" class="location-options hidden">
                    <label><input type="radio" name="locationType" value="region"> <span>Region</span></label>
                    <label><input type="radio" name="locationType" value="county"> <span>County</span></label>
                    <label><input type="radio" name="locationType" value="city"> <span>City</span></label>
                </div>

                <div id="locationDropdownWrapper" class="location-dropdown hidden">
                    <input
                        id="locationSearch"
                        type="text"
                        placeholder="Select locations..."
                        autocomplete="off"
                    >
                    <div id="selectedLocations" class="selected-locations"></div>
                    <div id="locationDropdown" class="dropdown-menu"></div>
                </div>
            </div>
        </div>

        <button id="searchButton" class="primary-button" type="button">Search</button>
        <div id="searchError" class="error-message hidden"></div>
    </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
